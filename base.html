<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}CampusFind{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header class="site-header">
    <a class="brand" href="{{ url_for('home') }}">Campus<span>Find</span></a>
    <nav>
        <a href="{{ url_for('home') }}">Home</a>
        <a href="{{ url_for('items') }}">Browse items</a>
        <a href="{{ url_for('about') }}">About</a>
        <a class="nav-button" href="{{ url_for('report', status='Lost') }}">Report an item</a>
    </nav>
</header>

<main class="container">
    {% with messages = get_flashed_messages() %}
      {% if messages %}
        {% for message in messages %}
          <div class="flash">{{ message }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}
    {% block content %}{% endblock %}
</main>

<footer>CampusFind · Helping campus belongings find their way home.</footer>
</body>
</html>
